name: Plugin Publish Workflow

# Builds the .difypkg on release and attaches it to that release.
#
# Promotion into the Dify catalog is deliberately manual: it means committing
# the package to the Anakin-Inc/anakin-dify-plugins fork and opening a PR to
# langgenius/dify-plugins. Automating that would require a personal access
# token, because GITHUB_TOKEN cannot write to another repository -- and a token
# that expires would break releases silently, months later, for a plugin that
# ships roughly twice a year. See RELEASING.md for the promotion steps.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # required to attach the package to the release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the Dify plugin CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          wget -q https://github.com/langgenius/dify-plugin-daemon/releases/download/0.0.6/dify-plugin-linux-amd64
          chmod +x dify-plugin-linux-amd64
          ls -la dify-plugin-linux-amd64

      - name: Read manifest
        id: info
        run: |
          PLUGIN_NAME=$(grep "^name:" manifest.yaml | cut -d' ' -f2)
          VERSION=$(grep "^version:" manifest.yaml | cut -d' ' -f2)
          AUTHOR=$(grep "^author:" manifest.yaml | cut -d' ' -f2)
          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "name=$PLUGIN_NAME version=$VERSION author=$AUTHOR"

      - name: Fail if the release tag disagrees with the manifest
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          # Catches the easy mistake of tagging v0.0.4 while manifest.yaml still
          # says 0.0.3 -- the catalog would then carry a mislabelled package.
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag '$TAG' does not match manifest version '$VERSION'"
            exit 1
          fi
          echo "tag and manifest agree on $VERSION"

      - name: Package plugin
        id: package
        run: |
          PACKAGE_NAME="${{ steps.info.outputs.plugin_name }}-${{ steps.info.outputs.version }}.difypkg"
          "$RUNNER_TEMP/bin/dify-plugin-linux-amd64" plugin package . -o "$PACKAGE_NAME"
          ls -la "$PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Attach package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.package_name }}" --clobber

      - name: Upload package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}
          if-no-files-found: error

      - name: Next steps
        env:
          PKG: ${{ steps.package.outputs.package_name }}
          AUTHOR: ${{ steps.info.outputs.author }}
          NAME: ${{ steps.info.outputs.plugin_name }}
        run: |
          {
            echo "### Built \`$PKG\`"
            echo ""
            echo "To publish it to the Dify Marketplace:"
            echo ""
            echo "1. Download the package from this release"
            echo "2. Commit it to \`Anakin-Inc/anakin-dify-plugins\` at \`$AUTHOR/$NAME/$PKG\`"
            echo "3. Open a PR from that fork to \`langgenius/dify-plugins\`"
            echo ""
            echo "See RELEASING.md for the full procedure."
          } >> "$GITHUB_STEP_SUMMARY"
